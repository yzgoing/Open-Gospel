[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-gospel"
version = "0.1.0"
description = "An open sect protocol and local temple runtime for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "A" }
]
keywords = ["ai", "agents", "protocol", "governance", "coordination"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only"
]

[project.scripts]
open-gospel = "open_gospel.cli:main"

[tool.setuptools]
packages = ["open_gospel"]
